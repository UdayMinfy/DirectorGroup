AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_REGION: ap-southeast-2
          BEDROCK_MODEL_ID: au.anthropic.claude-sonnet-4-5-20250929-v1:0
          BROWSER_REGION: ap-southeast-2
          BROWSER_IDENTIFIER: DirectorGroup-aqScKjlUJn
          SEARCH_API_PROVIDER: tavily
          TAVILY_API_KEY: ""
          SEARCH_RESULT_LIMIT: 3
          SEARCH_CANDIDATE_LIMIT: 3
          USE_TAVILY_RESULT_ORDER: true
          MAX_PAGE_CHARS: 18000
          MAX_SOURCE_CHARS: 6000
          REQUEST_TIMEOUT_SECONDS: 8
          SEARCH_TIMEZONE: Asia/Kolkata
          DB_HOST: host.docker.internal
          DB_PORT: 5433
          DB_NAME: ecommerce_db
          DB_USER: ecommerce_user
          DB_PASSWORD: ecommerce_pass
          JWT_VALIDATION_ENABLED: true
          COGNITO_REGION: ap-southeast-2
          COGNITO_USER_POOL_ID: "ap-southeast-2_gsJ5J02mu"
          COGNITO_APP_CLIENT_ID: "v218rbfdovpt96f0uurquohib"
          HARDCODED_USER_EMAIL: "Dillip.Mohanty@directed.com.au"
          TOKEN_BUDGETS_TABLE: DirectedGroup-UserTokenBudgets
          DEFAULT_DAILY_TOKEN_LIMIT: 0
          DEFAULT_MONTHLY_TOKEN_LIMIT: 0
          REQUEST_TOKEN_PRECHECK: 0
          MODEL_INPUT_COST_PER_1K: 0
          MODEL_OUTPUT_COST_PER_1K: 0
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - Authorization
            - Content-Type
          AllowMethods:
            - POST
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock-agentcore:StartBrowserSession
                - bedrock-agentcore:GetBrowserSession
                - bedrock-agentcore:StopBrowserSession
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/DirectedGroup-UserTokenBudgets
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ChatSessions

Outputs:
  ChatFunctionUrl:
    Description: Direct Lambda Function URL for chat requests
    Value: !GetAtt ChatFunctionUrl.FunctionUrl


