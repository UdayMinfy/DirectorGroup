AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  ChatFunctionV2:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["app.lambda_handler"]
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_REGION: ap-southeast-2
          BEDROCK_MODEL_ID: au.anthropic.claude-sonnet-4-5-20250929-v1:0
          LITELLM_TOKENIZER_MODEL: claude-3.5-sonnet
          BROWSER_REGION: ap-southeast-2
          BROWSER_IDENTIFIER: DirectorGroup-aqScKjlUJn
          TAVILY_API_KEY: "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"
          MAX_PAGE_CHARS: 18000
          MAX_SOURCE_CHARS: 6000
          MAX_PROMPT_LENGTH: 4000
          REQUEST_TIMEOUT_SECONDS: 8
          JWT_ISSUER: ""
          JWT_JWKS_URL: ""
          COGNITO_REGION: ap-southeast-2
          COGNITO_USER_POOL_ID: "ap-southeast-2_gsJ5J02mu"
          COGNITO_APP_CLIENT_ID: "v218rbfdovpt96f0uurquohib"
          CHAT_SESSIONS_TABLE: ChatSessions
          DYNAMODB_REGION: ap-southeast-2
          TOKEN_BUDGETS_TABLE: DirectedGroup-UserTokenBudgets
          DEFAULT_DAILY_TOKEN_LIMIT: 0
          DEFAULT_MONTHLY_TOKEN_LIMIT: 0
          REQUEST_TOKEN_PRECHECK: 0
          MODEL_INPUT_COST_PER_1K: 0
          MODEL_OUTPUT_COST_PER_1K: 0
          REQUEST_LOGS_TABLE: RequestLogs
          INPUT_TOKEN_COST_PER_1K: 0.003
          OUTPUT_TOKEN_COST_PER_1K: 0.015
          MODEL_NAME: claude-sonnet-4-5
      FunctionUrlConfig:
        AuthType: AWS_IAM
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "https://d3opfbhb4e7hs6.cloudfront.net"
            - "http://localhost:5173"
            - "http://localhost:3000"
          AllowHeaders:
            - content-type
            - x-user-token
            - authorization
            - x-amz-date
            - x-amz-security-token
            - x-amz-content-sha256
          AllowMethods:
            - POST
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock-agentcore:StartBrowserSession
                - bedrock-agentcore:GetBrowserSession
                - bedrock-agentcore:StopBrowserSession
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/DirectedGroup-UserTokenBudgets
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ChatSessions
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/RequestLogs
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/ap-southeast-2_gsJ5J02mu
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .

  ChatFunctionV2InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunctionV2
      Action: lambda:InvokeFunctionUrl
      Principal: arn:aws:iam::435415984578:role/service-role/directtech_identity_poolrole
      FunctionUrlAuthType: AWS_IAM

  RequestLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RequestLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: email
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: email-timestamp-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: session-timestamp-index
          KeySchema:
            - AttributeName: session_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Purpose
          Value: RequestLogging

Outputs:
  ChatFunctionV2Url:
    Description: Direct Lambda Function URL for chat requests
    Value: !GetAtt ChatFunctionV2Url.FunctionUrl



